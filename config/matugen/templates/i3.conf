# === Borders ===
set $focused_color {{ colors.primary.default.hex | set_lightness: 60.0 }}
set $unfocused_color {{ colors.surface_container.default.hex | set_lightness: 30.0 }}
set $urgent_color {{ colors.error.default.hex | set_lightness: 50.0 }}

# client.name title_borders title_background title_foreground bottom_border borders

client.focused #000000 $focused_color #000000 $focused_color $focused_color
client.urgent $urgent_color #000000 $urgent_color $urgent_color $urgent_color

client.unfocused $focused_color #000000 $focused_color $unfocused_color $unfocused_color
client.focused_inactive $focused_color #000000 $focused_color $unfocused_color $unfocused_color

default_border pixel 2
default_floating_border none

# smart_borders on

# === Gaps ===
gaps inner 8
gaps outer 4
gaps top 0
# smart_gaps on

# === Floating windows ===
for_window [ title="Volume Control" ] floating enable
for_window [ title="Network Connections" ] floating enable
for_window [ title="Bluetooth Devices" ] floating enable

# === Other ===
title_align center
