include-file = settings.ini

[bar/panel]
width = 100%
height = 22pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = JetBrainsMonoNerdFont;1

modules-left = i3
modules-center = date
modules-right = systray network bluetooth pulseaudio battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
fixed-center = true

; ===== Left =====

[module/i3]
type = internal/i3

pin-workspaces = true
index-sort = true

ws-icon-0 = 1;󰲠
ws-icon-1 = 2;󰲢
ws-icon-2 = 3;󰲤
ws-icon-3 = 4;󰲦
ws-icon-4 = 5;󰲨
ws-icon-5 = 6;󰲪
ws-icon-6 = 7;󰲬
ws-icon-7 = 8;󰲮
ws-icon-8 = 9;󰲰
ws-icon-9 = 10;󰿬
ws-icon-default = 

label-focused = %icon%
label-focused-padding = 1

label-unfocused = 
label-unfocused-padding = 1

label-urgent = 󰗖
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

label-visible = 
label-visible-foreground = ${colors.disabled}
label-visible-padding = 1

; ===== Center =====

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %e %b %H:%M:%S

label = %date%

; ===== Right =====

[module/systray]
type = internal/tray

format-margin = 1pt
tray-spacing = 7pt

[module/network]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 1.0

format-connected = %{A1:$HOME/.config/polybar/scripts/wifi.sh off:}%{A3:nm-connection-editor:}<ramp-signal>%{A}%{A}
format-disconnected = %{A1:$HOME/.config/polybar/scripts/wifi.sh on:}%{A3:nm-connection-editor:}󰤭%{A}%{A}
format-packetloss = 

ramp-signal-0 = 󰤫
ramp-signal-1 = 󰤯
ramp-signal-2 = 󰤟
ramp-signal-3 = 󰤢
ramp-signal-4 = 󰤥
ramp-signal-5 = 󰤨

[module/bluetooth]
type = custom/script
exec = $HOME/.config/polybar/scripts/bluetooth.sh
click-left = "$HOME/.config/polybar/scripts/bluetooth_toggle.sh"
click-right = "blueman-manager"

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume> <label-volume>

label-volume = " %percentage%%"

label-muted =  

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

click-right = pavucontrol

[module/battery]
type = internal/battery
full-at = 95
low-at = 20

battery = BAT1
adapter = ADP1

poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-low = <animation-low><label-low>

label-discharging = %percentage%%
label-charging = %percentage%%
label-full = 󱟢 %percentage%%
label-low = 󰂎 %percentage%%

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂

animation-charging-0 = 󰢟
animation-charging-1 = 󰂆
animation-charging-2 = 󰂈
animation-charging-3 = 󰂉
animation-charging-4 = 󰂊
animation-charging-5 = 󰂅
animation-charging-framerate = 750

animation-low-0 = !
animation-low-0-foreground = ${colors.alert}
animation-low-1 = " "
animation-low-framerate = 750
