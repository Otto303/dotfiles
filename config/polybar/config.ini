include-file = ~/.config/polybar/colors.ini

[bar/top]
width = 100%
height = 22pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 1.5

font-0 = JetBrainsMonoNerdFont;1

modules-left = archlinux i3
modules-center = date
modules-right = systray aurhelper cpu memory filesystem airplane bluetooth network pulseaudio battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
fixed-center = true

; === modules ===
; Left
[module/archlinux]
type = custom/text
format = 
click-left = rofi -show drun

[module/i3]
type = internal/i3

pin-workspaces = true
index-sort = true

label-mode = [%mode%]

label-focused = %name%
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.disabled}
label-visible-padding = 1

; Center
[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %e.%m.%y %H:%M:%S

label = %date%

; Right
[module/systray]
type = internal/tray

format-margin = 1pt
tray-spacing = 7pt

[module/aurhelper]
type = custom/script
exec = $HOME/.config/polybar/scripts/aurhelper.sh
interval = 3600

[module/airplane]
type = custom/script
exec = rfkill list | grep -q 'Soft blocked: yes' && echo '󰀝' || echo ''

[module/bluetooth]
type = custom/script
exec = $HOME/.config/polybar/scripts/bluetooth.sh
click-left = $HOME/.config/rofi/scripts/bluetooth.sh

[module/network]
type = internal/network
; interface = wlan1
interface-type = wireless
interval = 1.0

format-connected = %{A1:$HOME/.config/rofi/scripts/wifi.sh:}<ramp-signal>%{A}
format-disconnected = %{A1:$HOME/.config/rofi/scripts/wifi.sh:}󰤭%{A}
format-packetloss = %{A1:$HOME/.config/rofi/scripts/wifi.sh:}%{A}

ramp-signal-0 = 󰤫
ramp-signal-1 = 󰤯
ramp-signal-2 = 󰤟
ramp-signal-3 = 󰤢
ramp-signal-4 = 󰤥
ramp-signal-5 = 󰤨

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume> <bar-volume>

label-volume = %percentage:02%%

label-muted =  

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 

bar-volume-width = 6
bar-volume-indicator = 
bar-volume-fill = 
bar-volume-empty = 

bar-volume-empty-foreground = ${colors.disabled}

click-right = pavucontrol

[module/battery]
type = internal/battery
full-at = 95
low-at = 20

battery = BAT1
adapter = ADP1

poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-low = <animation-low><label-low>

label-discharging = %percentage%%
label-charging = %percentage%%
label-full = 󱟢 %percentage%%
label-low = 󰂎 %percentage%%

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂

animation-charging-0 = 󰢟
animation-charging-1 = 󰂆
animation-charging-2 = 󰂈
animation-charging-3 = 󰂉
animation-charging-4 = 󰂊
animation-charging-5 = 󰂅
animation-charging-framerate = 750

animation-low-0 = !
animation-low-0-foreground = ${colors.alert}
animation-low-1 = " "
animation-low-framerate = 750

[module/cpu]
type = internal/cpu
interval = 2

format-prefix = " 󰇙"
format = <ramp-coreload>

ramp-coreload-0 = " "
ramp-coreload-1 = ▁
ramp-coreload-2 = ▂
ramp-coreload-3 = ▃
ramp-coreload-4 = ▄
ramp-coreload-5 = ▅
ramp-coreload-6 = ▆
ramp-coreload-7 = ▇
ramp-coreload-8 = █
ramp-coreload-spacing = 0

[module/memory]
type = internal/memory
interval = 2

format-prefix = " 󰇙"
format = <ramp-used>

ramp-used-0 = ▁
ramp-used-1 = ▂
ramp-used-2 = ▃
ramp-used-3 = ▄
ramp-used-4 = ▅
ramp-used-5 = ▆
ramp-used-6 = ▇
ramp-used-7 = █

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

format-mounted-prefix = " 󰇙"
format-mounted = <ramp-capacity>

ramp-capacity-0 = █
ramp-capacity-1 = ▇
ramp-capacity-2 = ▆
ramp-capacity-3 = ▅
ramp-capacity-4 = ▄
ramp-capacity-5 = ▃
ramp-capacity-6 = ▂
ramp-capacity-7 = ▁
