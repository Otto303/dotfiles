[colors]
background = #222222
background-alt = #333333
foreground = #FFFFFF
primary = #2288FF
secondary = #8ABEB7
alert = #FF0000
disabled = #666666

[bar/panel]
width = 100%
height = 22pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMonoNerdFont;1

modules-left = xworkspaces
modules-center = time
modules-right = systray settings

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/systray]
type = internal/tray

format-margin = 2pt
tray-spacing = 8pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.foreground}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/time]
type = custom/script
exec = date +%R
interval = 30
click-left = ~/.config/rofi/date/start.sh

[module/settings]
type = custom/script
exec = ~/.config/polybar/settings.sh
click-left = ~/.config/rofi/settings/start.sh
