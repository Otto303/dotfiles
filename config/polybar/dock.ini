include-file = settings.ini

[bar/dock]
width = 100%
height = 12pt

background = ${colors.background}
foreground = ${colors.foreground}
 
line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = JetBrainsMonoNerdFont;1

modules-left = xkeyboard backlight xwindow
modules-center =
modules-right = cpu memory filesystem

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
fixed-center = true
bottom = true

; ===== Left =====

[module/xkeyboard]
type = internal/xkeyboard

label-layout = %{A1:$HOME/.config/rofi/layout/start.sh:} %layout%%{A}

label-indicator-on-capslock = 󰌾
label-indicator-on-numlock = 
label-indicator-on-scrolllock = 

[module/backlight]
type = internal/backlight

format = <ramp> <label>
label = %percentage%%

ramp-0 = 󱩎
ramp-1 = 󱩏
ramp-2 = 󱩐
ramp-3 = 󱩑
ramp-4 = 󱩒
ramp-5 = 󱩓
ramp-6 = 󱩔
ramp-7 = 󱩖
ramp-8 = 󰛨

[module/xwindow]
type = internal/xwindow

label = 󱂬 %title%
label-maxlen = 32

label-empty = 󱂬 empty
label-empty-foreground = ${colors.disabled}

; ===== Center =====

; ===== Right =====

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
label = %percentage:02%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
label = %percentage_used:02%%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

label-mounted =  %percentage_used:02%%

label-unmounted =  %mountpoint%
label-unmounted-foreground = ${colors.disabled}
