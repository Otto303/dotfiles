include-file = settings.ini

[bar/dock]
width = 100%
height = 12pt

background = ${colors.background}
foreground = ${colors.foreground}
 
line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = JetBrainsMonoNerdFont;1

modules-left = xkeyboard xwindow
modules-center =
modules-right = cpu memory filesystem

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
fixed-center = true
bottom = true

; ===== Left =====

[module/xkeyboard]
type = internal/xkeyboard

label-layout = %{A1:$HOME/.config/rofi/layout/start.sh:} %layout%%{A}

label-indicator-on-capslock = 󰌾
label-indicator-on-numlock = 
label-indicator-on-scrolllock = 

[module/xwindow]
type = internal/xwindow

label = 󱂬 %class%
label-maxlen = 40

label-empty = 󱂬 empty
label-empty-foreground = ${colors.disabled}

; ===== Center =====

; ===== Right =====

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
label = %percentage_used:2%%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

label-mounted =  %percentage_used:2%%

label-unmounted =  %mountpoint%
label-unmounted-foreground = ${colors.disabled}
