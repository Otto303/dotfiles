include-file = settings.ini

[bar/bottom]
width = 100%
height = 18pt

background = ${colors.background}
foreground = ${colors.foreground}
 
line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = JetBrainsMonoNerdFont;2

modules-left = power xkeyboard backlight aurhelper
modules-center = archlinux xwindow
modules-right = cpu memory filesystem

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
fixed-center = true
bottom = true

; ===== Left =====
[module/power]
type = custom/menu
expand-right = true

label-open = 
label-close = "  "

menu-0-0 = "  "
menu-0-0-exec = $HOME/.config/rofi/confirm/start.sh i3-msg exit
menu-0-1 = "󰦛  "
menu-0-1-exec = $HOME/.config/rofi/confirm/start.sh reboot
menu-0-2 = " "
menu-0-2-exec = $HOME/.config/rofi/confirm/start.sh shutdown now

[module/xkeyboard]
type = internal/xkeyboard

label-layout = %{A1:$HOME/.config/rofi/layout/start.sh:} %layout%%{A}

label-indicator-on-capslock = 󰌾
label-indicator-on-numlock = 
label-indicator-on-scrolllock = 

[module/backlight]
type = internal/backlight

format = <ramp> <label>
label = %percentage%%

ramp-0 = 󱩎
ramp-1 = 󱩏
ramp-2 = 󱩐
ramp-3 = 󱩑
ramp-4 = 󱩒
ramp-5 = 󱩓
ramp-6 = 󱩔
ramp-7 = 󱩖
ramp-8 = 󰛨

[module/aurhelper]
type = custom/script
exec = $HOME/.config/polybar/scripts/aurhelper.sh
interval = 3600

; ===== Center =====

[module/archlinux]
type = custom/text
format = 
click-left = rofi -show drun -config $HOME/.config/rofi/dmenu/config.rasi

[module/xwindow]
type = internal/xwindow

label = %title%
label-maxlen = 32

label-empty = " "
;label-empty-foreground = ${colors.disabled}

; ===== Right =====

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
label = %percentage:02%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
label = %percentage_used:02%%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

label-mounted =  %percentage_used:02%%

label-unmounted =  %mountpoint%
label-unmounted-foreground = ${colors.disabled}
