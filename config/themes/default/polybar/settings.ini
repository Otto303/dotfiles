; === bar/top ===

[module/i3]
type = internal/i3

pin-workspaces = true
index-sort = true

ws-icon-0 = 1;󰲠
ws-icon-1 = 2;󰲢
ws-icon-2 = 3;󰲤
ws-icon-3 = 4;󰲦
ws-icon-4 = 5;󰲨
ws-icon-5 = 6;󰲪
ws-icon-6 = 7;󰲬
ws-icon-7 = 8;󰲮
ws-icon-8 = 9;󰲰
ws-icon-9 = 10;󰿬
ws-icon-default = 

label-focused = %icon%
label-focused-padding = 1

label-unfocused = %icon%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 1

label-urgent = 󰗖
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

label-visible = %icon%
label-visible-foreground = ${colors.disabled}
label-visible-padding = 1

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %e %b %H:%M:%S

label = %date%

[module/systray]
type = internal/tray

format-margin = 1pt
tray-spacing = 7pt

[module/airplane]
type = custom/script
exec = rfkill list | grep -q 'Soft blocked: yes' && echo '󰀝' || echo ''

[module/bluetooth]
type = custom/script
exec = $HOME/.config/polybar/scripts/bluetooth.sh
click-left = $HOME/.config/rofi/bluetooth/start.sh

[module/network]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 1.0

format-connected = %{A1:$HOME/.config/rofi/wifi/start.sh:}<ramp-signal>%{A}
format-disconnected = %{A1:$HOME/.config/rofi/wifi/start.sh:}󰤭%{A}
format-packetloss = 

ramp-signal-0 = 󰤫
ramp-signal-1 = 󰤯
ramp-signal-2 = 󰤟
ramp-signal-3 = 󰤢
ramp-signal-4 = 󰤥
ramp-signal-5 = 󰤨

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume> <bar-volume>

label-volume = %percentage:02%%

label-muted =  

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

bar-volume-width = 6
bar-volume-indicator = 
bar-volume-fill = 
bar-volume-empty = 

bar-volume-empty-foreground = ${colors.disabled}

click-right = pavucontrol

[module/battery]
type = internal/battery
full-at = 95
low-at = 20

battery = BAT1
adapter = ADP1

poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-low = <animation-low><label-low>

label-discharging = %percentage%%
label-charging = %percentage%%
label-full = 󱟢 %percentage%%
label-low = 󰂎 %percentage%%

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂

animation-charging-0 = 󰢟
animation-charging-1 = 󰂆
animation-charging-2 = 󰂈
animation-charging-3 = 󰂉
animation-charging-4 = 󰂊
animation-charging-5 = 󰂅
animation-charging-framerate = 750

animation-low-0 = !
animation-low-0-foreground = ${colors.alert}
animation-low-1 = " "
animation-low-framerate = 750

; === bar/bottom ===

[module/power]
type = custom/menu
expand-right = true

label-open = 
label-close = "  "

menu-0-0 = "  "
menu-0-0-exec = $HOME/.config/rofi/confirm/start.sh i3-msg exit
menu-0-1 = "󰦛  "
menu-0-1-exec = $HOME/.config/rofi/confirm/start.sh reboot
menu-0-2 = " "
menu-0-2-exec = $HOME/.config/rofi/confirm/start.sh shutdown now

[module/xkeyboard]
type = internal/xkeyboard

label-layout = %{A1:$HOME/.config/rofi/layout/start.sh:} %layout%%{A}

label-indicator-on-capslock = 󰌾
label-indicator-on-numlock = 
label-indicator-on-scrolllock = 

[module/backlight]
type = internal/backlight

format = <ramp> <label>
label = %percentage%%

ramp-0 = 󱩎
ramp-1 = 󱩏
ramp-2 = 󱩐
ramp-3 = 󱩑
ramp-4 = 󱩒
ramp-5 = 󱩓
ramp-6 = 󱩔
ramp-7 = 󱩖
ramp-8 = 󰛨

[module/aurhelper]
type = custom/script
exec = $HOME/.config/polybar/scripts/aurhelper.sh
interval = 3600

[module/archlinux]
type = custom/text
format = 
click-left = rofi -show drun -config $HOME/.config/rofi/dmenu.rasi

[module/polywins]
type = custom/script
exec = ~/.config/polybar/scripts/polywins.sh
format = <label>
label = %output%
label-padding = 1
tail = true

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
label = %{A1:alacritty -e btop:}%percentage:02%%%{A}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
label = %{A1:alacritty -e btop:}%percentage_used:02%%%{A}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

label-mounted = %{A1:alacritty -e btop:} %percentage_used:02%%%{A}

label-unmounted = %{A1:alacritty -e btop:} %mountpoint%%{A}
label-unmounted-foreground = ${colors.disabled}
