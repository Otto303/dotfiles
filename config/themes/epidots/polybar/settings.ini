[settings]
screenchange-reload = true
pseudo-transparency = true

[module/archlinux]
type = custom/text
format = 
format-foreground = ${colors.primary}
click-left = rofi -show drun -config $HOME/.config/rofi/dmenu.rasi

[module/network]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 1.0

format-connected = %{A1:$HOME/.config/rofi/wifi/start.sh:}<ramp-signal>%{A}
format-disconnected = %{A1:$HOME/.config/rofi/wifi/start.sh:}󰤭%{A}
format-packetloss = 

ramp-signal-0 = 󰤫
ramp-signal-1 = 󰤯
ramp-signal-2 = 󰤟
ramp-signal-3 = 󰤢
ramp-signal-4 = 󰤥
ramp-signal-5 = 󰤨

[module/xworkspaces]
type                          = internal/xworkspaces
label-active                  = %name%
label-active-background       = ${colors.background-alt}
label-active-underline        = ${colors.primary}
label-active-padding          = 1
label-occupied                = %name%
label-occupied-padding        = 1
label-urgent                  = %name%
label-urgent-background       = ${colors.error}
label-urgent-padding          = 1
label-empty                   = %name%
label-empty-foreground        = ${colors.foreground}
label-empty-padding           = 1

[module/date]
type                          = internal/date
interval                      = 1
date                          = %H:%M
date-alt                      = %d.%m.%Y %H:%M:%S
label                         = %date%
label-foreground              = ${colors.foreground}

[module/pulseaudio]
type                          = internal/pulseaudio
use-ui-max                    = false
interval                      = 10
format-volume-foreground      = ${colors.primary}
format-volume                 = <ramp-volume> <label-volume>
label-volume                  = %percentage%%
ramp-volume-0                 = 
ramp-volume-1                 = 
ramp-volume-2                 = 
label-muted                   =  muted
label-muted-foreground        = ${colors.error}
click-right                   = pavucontrol

[module/cpu]
type                          = internal/cpu
interval                      = 4
format-foreground             = ${colors.secondary}
label                         =  %percentage%%

[module/memory]
type                          = internal/memory
interval                      = 4
format-foreground             = ${colors.secondary}
label                         =  %percentage_used%%

[module/battery0]
type                          = internal/battery
full-at                       = 99
low-at                        = 20
battery                       = BAT0
adapter                       = ADP1
poll-interval                 = 5
time-format                   = %H:%M
label-charging                = 󱟠 %percentage%%
label-discharging             = 󱟞 %percentage%%
label-full                    = 󰂄 Full
label-low                     = 󰂃 LOW - %time%h
format-charging-foreground    = ${colors.primary}
format-discharging-foreground = ${colors.primary}
format-full-foreground        = ${colors.primary}

[module/battery1]
type                          = internal/battery
full-at                       = 99
low-at                        = 20
battery                       = BAT1
adapter                       = ADP1
poll-interval                 = 5
time-format                   = %H:%M
label-charging                = 󱟠 %percentage%%
label-discharging             = 󱟞 %percentage%%
label-full                    = 󰂄 Full
label-low                     = 󰂃 LOW - %time%h
format-charging-foreground    = ${colors.primary}
format-discharging-foreground = ${colors.primary}
format-full-foreground        = ${colors.primary}

[module/tray]
type                          = internal/tray
tray-size                     = 70%
tray-spacing                  = 8ptrval = 16
