[colors]
background = #ee171924
background-alt = #1e2025
foreground = #e2e2e9
primary = #abc7ff
secondary = #bec6dc
alert = #ffb4ab

[bar/top]
width = 100%
height = 3.5%
dpi = 96
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
padding-left = 1
padding-right = 1
module-margin = 1.2

font-0 = JetBrainsMonoNerdFontPropo;3

modules-left = archlinux network tray xworkspaces
modules-center = date
modules-right = pulseaudio cpu memory battery

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; === modules ===
include-file = settings.ini
