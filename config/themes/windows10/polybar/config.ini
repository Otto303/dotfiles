[colors]
background = #242424
foreground = #ffffff
foreground-alt = #cccccc
alert = #ff6666
disabled = #777777

[bar/top]
width = 100%
height = 30pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = JetBrainsMonoNerdFont;4
font-1 = JetBrainsMonoNerdFont:size=18;4

modules-left = start search options1 i3
modules-center =
modules-right = options2 battery network pulseaudio date notif sep

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
fixed-center = true
bottom = true

; === modules ===
include-file = settings.ini
