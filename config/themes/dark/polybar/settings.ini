; === separators ===

[module/sep]
type = custom/text
label = " | "
label-foreground = ${colors.disabled}


[module/lbrack]
type = custom/text
label = [
label-foreground = ${colors.disabled}

[module/rbrack]
type = custom/text
label = ]
label-foreground = ${colors.disabled}

; === bar/top ===

[module/archlinux]
type = custom/text
format = 
click-left = rofi -show drun -config $HOME/.config/rofi/dmenu.rasi

[module/term]
type = custom/text
format = "  "
click-left = alacritty
format-foreground = ${colors.magenta}

[module/firefox]
type = custom/text
format = "󰈹  "
click-left = firefox
format-foreground = ${colors.orange}

[module/discord]
type = custom/text
format = " "
click-left = discord
format-foreground = ${colors.blue}

[module/i3]
type = internal/i3

pin-workspaces = true
index-sort = true

label-focused = %name%
label-focused-foreground = ${colors.blue}
label-focused-underline = ${colors.disabled}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.blue}
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.disabled}
label-visible-padding = 1

[module/systray]
type = internal/tray

format-margin = 1pt
tray-spacing = 7pt

[module/airplane]
type = custom/script
exec = rfkill list | grep -q 'Soft blocked: yes' && echo '󰀝 ' || echo ''

[module/bluetooth]
type = custom/script
exec = $HOME/.config/polybar/scripts/bluetooth.sh
click-left = $HOME/.config/rofi/bluetooth/start.sh

label = "%output% "
label-foreground = ${colors.blue}

[module/network]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 1.0

format-connected = %{A1:$HOME/.config/rofi/wifi/start.sh:}<ramp-signal> <label-connected> %{A}
format-disconnected = %{A1:$HOME/.config/rofi/wifi/start.sh:}<label-disconnected>%{A}
format-packetloss = 

label-connected = %essid%
label-connected-foreground = ${colors.magenta}
label-disconnected = "󰤭 disconnected "
label-disconnected-foreground = ${colors.disabled}

ramp-signal-0 = 󰤫
ramp-signal-1 = 󰤯
ramp-signal-2 = 󰤟
ramp-signal-3 = 󰤢
ramp-signal-4 = 󰤥
ramp-signal-5 = 󰤨
ramp-signal-foreground = ${colors.magenta}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = "<ramp-volume> <bar-volume>  "

label-muted = "   "
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.blue}

bar-volume-width = 6
bar-volume-indicator = 
bar-volume-fill = 
bar-volume-empty = 

bar-volume-indicator-foreground = ${colors.magenta}
bar-volume-fill-foreground = ${colors.blue}
bar-volume-empty-foreground = ${colors.blue}

click-right = pavucontrol

[module/battery]
type = internal/battery
full-at = 95
low-at = 20

battery = BAT1
adapter = ADP1

poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-low = <label-low>

label-discharging = %percentage%%
label-discharging-foreground = ${colors.yellow}

label-charging = %percentage%%
label-charging-foreground = ${colors.yellow}

label-full =   %percentage%%
label-full-foreground = ${colors.green}

label-low =   %percentage%%
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.yellow}

animation-charging-0 =  󱐋
animation-charging-1 =  󱐋
animation-charging-2 =  󱐋
animation-charging-3 =  󱐋
animation-charging-4 =  󱐋
animation-charging-foreground = ${colors.yellow}
animation-charging-framerate = 750

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %e %b %H:%M:%S

label = %date%
label-foreground = ${colors.orange}

; === bar/bottom ===

[module/power]
type = custom/menu
expand-right = true

label-open = 
label-close = "  "

menu-0-0 = "  "
menu-0-0-exec = $HOME/.config/rofi/confirm/start.sh i3-msg exit
menu-0-1 = "󰦛  "
menu-0-1-exec = $HOME/.config/rofi/confirm/start.sh reboot
menu-0-2 = " "
menu-0-2-exec = $HOME/.config/rofi/confirm/start.sh shutdown now

label-open-foreground = ${colors.alert}
label-close-foreground = ${colors.alert}
menu-0-0-foreground = ${colors.alert}
menu-0-1-foreground = ${colors.alert}
menu-0-2-foreground = ${colors.alert}

[module/xkeyboard]
type = internal/xkeyboard

label-layout = %{A1:$HOME/.config/rofi/layout/start.sh:} %layout%%{A}
label-layout-foreground = ${colors.magenta}

label-indicator-on-capslock = 󰌾
label-indicator-on-numlock = 
label-indicator-on-scrolllock = 

[module/backlight]
type = internal/backlight

format = <ramp> <label>
label = %percentage%%
label-foreground = ${colors.yellow}

ramp-0 = 󱩎
ramp-1 = 󱩏
ramp-2 = 󱩐
ramp-3 = 󱩑
ramp-4 = 󱩒
ramp-5 = 󱩓
ramp-6 = 󱩔
ramp-7 = 󱩖
ramp-8 = 󰛨
ramp-foreground = ${colors.yellow}

[module/aurhelper]
type = custom/script
exec = $HOME/.config/polybar/scripts/aurhelper.sh
label-foreground = ${colors.blue}
interval = 3600

[module/cpu]
type = internal/cpu
interval = 2

format-prefix = " 󰇙"
format = <ramp-coreload>

ramp-coreload-0 = " "
ramp-coreload-1 = ▁
ramp-coreload-2 = ▂
ramp-coreload-3 = ▃
ramp-coreload-4 = ▄
ramp-coreload-5 = ▅
ramp-coreload-6 = ▆
ramp-coreload-7 = ▇
ramp-coreload-8 = █
ramp-coreload-spacing = 0
ramp-coreload-foreground = ${colors.cpu}

[module/memory]
type = internal/memory
interval = 2

format-prefix = " 󰇙"
format = <ramp-used>

ramp-used-0 = " "
ramp-used-1 = ▁
ramp-used-2 = ▂
ramp-used-3 = ▃
ramp-used-4 = ▄
ramp-used-5 = ▅
ramp-used-6 = ▆
ramp-used-7 = ▇
ramp-used-foreground = ${colors.mem}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

format-mounted-prefix = " 󰇙"
format-mounted = <bar-used>

bar-used-indicator =
bar-used-width = 6
bar-used-fill = 󰝤
bar-used-empty = 󰝤
bar-used-foreground-0 = ${colors.fs}
bar-used-empty-foreground = ${colors.gray}
