; === separators ===

[module/sep]
type = custom/text
label = " | "
label-foreground = ${colors.disabled}


[module/lbrack]
type = custom/text
label = [
label-foreground = ${colors.disabled}

[module/rbrack]
type = custom/text
label = ]
label-foreground = ${colors.disabled}

; === bar/top ===

[module/archlinux]
type = custom/text
format = 
click-left = rofi -show drun -config $HOME/.config/rofi/dmenu/config.rasi

[module/term]
type = custom/text
format = "  "
click-left = alacritty
format-foreground = ${colors.magenta}

[module/firefox]
type = custom/text
format = "󰈹  "
click-left = firefox
format-foreground = ${colors.orange}

[module/discord]
type = custom/text
format = " "
click-left = discord
format-foreground = ${colors.blue}

[module/i3]
type = internal/i3

pin-workspaces = true
index-sort = true

label-focused = %name%
label-focused-foreground = ${colors.yellow}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.pastel-yellow}
label-unfocused-padding = 1

label-urgent = 󰗖
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.disabled}
label-visible-padding = 1

[module/systray]
type = internal/tray

format-margin = 1pt
tray-spacing = 7pt

[module/network]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 1.0

format-connected = %{A1:$HOME/.config/rofi/wifi/start.sh:}<ramp-signal> <label-connected> %{A}
format-disconnected = %{A1:$HOME/.config/rofi/wifi/start.sh:}<label-disconnected>%{A}
format-packetloss = 

label-connected = %essid%
label-connected-foreground = ${colors.blue}
label-disconnected = "󰤭 disconnected "
label-disconnected-foreground = ${colors.disabled}

ramp-signal-0 = 󰤫
ramp-signal-1 = 󰤯
ramp-signal-2 = 󰤟
ramp-signal-3 = 󰤢
ramp-signal-4 = 󰤥
ramp-signal-5 = 󰤨
ramp-signal-foreground = ${colors.blue}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = "<ramp-volume> <bar-volume>  "

label-muted = "   "
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.magenta}

bar-volume-width = 6
bar-volume-indicator = 
bar-volume-fill = 
bar-volume-empty = 

bar-volume-indicator-foreground = ${colors.magenta}
bar-volume-fill-foreground = ${colors.magenta}
bar-volume-empty-foreground = ${colors.disabled}

click-right = pavucontrol

[module/battery]
type = internal/battery
full-at = 95
low-at = 20

battery = BAT1
adapter = ADP1

poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-low = <label-low>

label-discharging = %percentage%%
label-discharging-foreground = ${colors.pastel-yellow}

label-charging = %percentage%%
label-charging-foreground = ${colors.pastel-yellow}

label-full =   %percentage%%
label-full-foreground = ${colors.green}

label-low =   %percentage%%
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.pastel-yellow}

animation-charging-0 =  󱐋
animation-charging-1 =  󱐋
animation-charging-2 =  󱐋
animation-charging-3 =  󱐋
animation-charging-4 =  󱐋
animation-charging-foreground = ${colors.pastel-yellow}
animation-charging-framerate = 750

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %e %b %H:%M:%S

label = %date%
label-foreground = ${colors.orange}
