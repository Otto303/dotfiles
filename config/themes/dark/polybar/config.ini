[colors]
; base colors
background = #181820
foreground = #ffffcc
alert = #ff0000
disabled = #888888
primary = #88aaff

; colors
green = #88ff88
magenta = #ee88ff
orange = #ffaa88
purple = #aa00dd
blue = #4488ff
yellow = #cccc66

; workspaces
blue-alt = #ccccff

; battery

; bottom
gray = #444444
cpu = #ee4422
mem = #ccaa88
fs = #55aa55

[bar/top]
width = 100%
height = 24pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 0

font-0 = JetBrainsMonoNerdFont;1

modules-left = archlinux sep term firefox tor discord sep lbrack i3 rbrack space aurhelper
modules-center =
modules-right = systray sep cpu memory filesystem sep lbrack xkeyboard rbrack space airplane bluetooth network pulseaudio battery sep date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
fixed-center = true

abel-foreground = ${colors.orange}

; === modules ===
include-file = settings.ini
