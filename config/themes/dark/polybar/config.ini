[colors]
; base colors
background = #181828
foreground = #ffffff
alert = #ff0000
disabled = #888888

; app colors
magenta = #ee88ff
orange = #ffaa88
blue = #88aaff

; workspaces
blue-alt = #ccccff

; battery
yellow = #cccc66
green = #88ff88

; bottom
gray = #444444
cpu = #ee4422
mem = #ccaa88
fs = #55aa55

[bar/top]
width = 100%
height = 24pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 0

font-0 = JetBrainsMonoNerdFont;1

modules-left = archlinux sep term firefox discord sep lbrack i3 rbrack
modules-center =
modules-right = systray sep airplane bluetooth network pulseaudio battery sep date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
fixed-center = true

abel-foreground = ${colors.orange}

[bar/bottom]
width = 100%
height = 18pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = JetBrainsMonoNerdFont;2

modules-left = power xkeyboard backlight aurhelper
modules-center =
modules-right = cpu memory filesystem

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
fixed-center = true
bottom = true

abel-foreground = ${colors.orange}
; === modules ===
include-file = settings.ini
