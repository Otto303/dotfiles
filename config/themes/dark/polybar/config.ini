[colors]
; base colors
background = #181818
foreground = #ffffff
alert = #ff0000
disabled = #888888

; app colors
magenta = #ee88ff
orange = #ffaa88
blue = #88aaff

; battery
yellow = #ffff00
pastel-yellow = #cccc66
green = #88ff88

[bar/top]
width = 100%
height = 24pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 0

font-0 = JetBrainsMonoNerdFont;1

modules-left = archlinux sep term firefox discord sep lbrack i3 rbrack
modules-center =
modules-right = systray sep network pulseaudio battery sep date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
fixed-center = true

abel-foreground = ${colors.orange}

; === modules ===
include-file = settings.ini
